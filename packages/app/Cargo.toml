[package]
name = "pulsar-app"
description = "Entry point to application and state machine logic for Pulsarium"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[features]
lmdb = ["pulsar-storage/lmdb"]

[dependencies]
pulsar-std = { workspace = true }
pulsar-storage = { workspace = true }

cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true }
cw-storage-plus = { workspace = true }
cw-utils = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
itertools = { workspace = true }
parking_lot = {workspace = true}
bytes = {workspace = true}
sha2 = {workspace = true}

cosmwasm-vm = { version = "1.2.0", default-features = false, features = ["iterator"] }
# needed just for the responses for the messages - proto-encoded, maybe we can pull this out to just a few structs
cosmos-sdk-proto = { workspace = true }

[dev-dependencies]
hex-literal = { workspace = true }
cw20-base = { version = "1.0.1" }
cw20 = { version = "1.0.1" }
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }

