[package]
name = "slay3r-app"
description = "Entry point to application and state machine logic for Slay3r"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[features]
lmdb = ["slay3r-storage/lmdb"]
rocksdb = ["slay3r-storage/rocksdb"]

[dependencies]
slay3r-std = { workspace = true }
slay3r-storage = { workspace = true }

cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true }
cw20 = { workspace = true }
cw-storage-plus = { workspace = true }
cw-utils = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
itertools = { workspace = true }
parking_lot = {workspace = true}
bytes = {workspace = true}
sha2 = {workspace = true}

cosmwasm-vm = { workspace = true }
# needed just for the responses for the messages - proto-encoded, maybe we can pull this out to just a few structs
cosmos-sdk-proto = { workspace = true }

cw-orch-core = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
hex-literal = { workspace = true }
cw20-base = { workspace = true }
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
tc-echo = { workspace = true, features = ["library"]}
tc-caller = { workspace = true, features = ["library"] }
