[package]
name = "layer-golem"
edition.workspace = true
version.workspace = true
license.workspace = true
exclude.workspace = true
description = "An artificial creature, taking the shape of the sly3r chain. Provides bindings to cw-orch to experiment rapidly"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cosmwasm-std = { workspace = true }
abstract-cw-multi-test = { workspace = true }

sha2 = { workspace = true }
serde = { workspace = true }
cw-orch-core = { workspace = true }

layer-app = { workspace = true }
layer-cosmos = { workspace = true }
layer-std = { workspace = true }
layer-storage = { workspace = true }

# crypto stuff (from cosmrs... not sure if we need to be so strict
k256 = { version = "0.13", default-features = false }
bip32 = "0.5"

# for testing wasm integration
[dev-dependencies]
abstract-cw20-base = { version = "2.0"}
abstract-cw20 = { version = "2.0"}
abstract-cw-plus-interface = { version = "2.0.1"}
