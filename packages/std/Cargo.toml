[package]
name = "layer-std"
description = "Standard types for Slay3r"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cosmwasm-std = { workspace = true }
cosmwasm-schema = { workspace = true }
cosmwasm-crypto = { workspace = true }
cw-storage-plus = { workspace = true }
layer-root = { workspace = true, features = ["library"]}

thiserror = { workspace = true }
itertools = { workspace = true }
sha2 = { workspace = true }
ripemd = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
hex = { workspace = true }
bech32 = { version = "0.9.1", default-features = false }
chrono = { version = "0.4.19", default-features = false, features = ["std"] }
derivative = "2.2.0"

# TODO: move this up to top level Cargo if it works out
alloy-primitives = { version = "0.8.2", default-features = false }