[package]
name = "pulsar-wasm"
description = "Pulsarium bindings for cosmwasm-vm"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []

[dependencies]
pulsar-app = { workspace = true }
pulsar-std = { workspace = true }
pulsar-storage = { workspace = true }
cosmwasm-std = { workspace = true }
cw-storage-plus = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tracing = {workspace = true}

cosmwasm-vm = { version = "1.2.0", default-features = false, features = ["iterator"] }

[dev-dependencies]
cw20-base = { version = "1.0.1" }
cw20 = { version = "1.0.1" }