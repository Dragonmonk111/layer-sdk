[package]
name = "junoclaw-mayo-verify"
version = "0.1.0"
edition = "2021"
authors = ["JunoClaw Contributors"]
description = "Pure-Rust MAYO post-quantum signature verifier (vendored from junoclaw/crates for native chain use)"
license = "Apache-2.0"

# VENDORED COPY of junoclaw/crates/junoclaw-mayo-verify.
# Keep in sync — the contract crate and this chain-native copy must verify
# identical signatures. If you change verify.rs/params.rs, change both.
# Vendored (rather than path-dep'd) because Docker builds are scoped to
# junoclaw-chain only.

[dependencies]
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
aes = { version = "0.8", default-features = false }

[dev-dependencies]
hex-literal = "0.4"
hex = "0.4"
rand_chacha = "0.3"
rand_core = "0.6"
sha2 = "0.10"

# sriracha-mayo provides real MAYO keypairs+sigs for tests (verify-only crate).
# Its build script requires cmake + a C toolchain — only gate it on unix so
# `cargo test` still compiles on Windows (test-c tests are cfg-gated anyway).
[target.'cfg(unix)'.dev-dependencies]
sriracha-mayo = "0.0.4"

[features]
default = ["std"]
std = ["sha2/std", "sha3/std"]
# Enables the sriracha-mayo cross-check tests in lib.rs (C impl is a
# cfg(unix) dev-dep — only usable on Unix hosts with cmake).
test-c = ["std"]
