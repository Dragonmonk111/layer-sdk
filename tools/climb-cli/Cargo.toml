[package]
name = "dev-tools-cli"
version = "0.0.0"
description = "Dev Tools"
edition = "2021"
license = "Apache-2.0"

[dependencies]
layer-climb = { path = "../../packages/climb" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.81"
tokio = { version = "1", features = ["full"] }
clap = { version = "4.5.7", features = ["derive"] }
futures = "0.3"
cosmwasm-std = "2.0.3"
tracing = "0.1.40"
dotenvy = {version = "0.15.7", features = ["cli"]}
tracing-subscriber = "0.3.18"
