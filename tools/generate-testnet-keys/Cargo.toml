[package]
name = "generate-testnet-keys"
version = "0.1.0"
edition = "2021"

# This tool is NOT a workspace member. The empty [workspace] table below prevents
# Cargo from auto-detecting the parent workspace when built with:
#   cargo build --manifest-path tools/generate-testnet-keys/Cargo.toml
# Or: cd tools/generate-testnet-keys && cargo build
[workspace]

[[bin]]
name = "generate-testnet-keys"
path = "src/main.rs"

[dependencies]
commonware-cryptography = "2026.3.0"
commonware-utils = "2026.3.0"
commonware-math = "2026.3.0"
commonware-codec = "2026.3.0"
commonware-parallel = "2026.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
hex = "0.4"
# dealing-priv-* payload encryption (D5): each per-player file carries the
# share only as an X25519+XChaCha20-Poly1305 ciphertext sealed to the
# recipient's Ed25519 identity, so the coordinator who distributes files
# never holds plaintext shares.
x25519-dalek = { version = "2", features = ["static_secrets"] }
curve25519-dalek-ng = "4"
chacha20poly1305 = "0.10"
sha2 = "0.10"
# commonware-cryptography → aws-lc-rs needs NASM on Windows; prebuilt-nasm
# ships precompiled asm objects so no assembler install is required.
aws-lc-rs = { version = "1", features = ["prebuilt-nasm"] }

# MAYO2 keygen for hybrid validator identity (PQ_PROTOCOL_AUTH.md §3).
# C-backed signer — Unix only; on other platforms keys.json omits the
# mayo_* fields and hybrid_consensus nodes will refuse to boot.
[target.'cfg(unix)'.dependencies]
sriracha-mayo = "0.0.4"
