[package]
name = "climb-web"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = ["dev"]
autoconnect = []
dev = ["wasm-logger", "console_error_panic_hook","awsm_web/unwrap_verbose"]

[dependencies]
layer-climb = { path = "../../packages/climb", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.81"
futures = "0.3"
cosmwasm-std = "2.0.3"
futures-timer = "3.0.3"
wasm-bindgen = "0.2.93"
dominator = "0.5.38"
futures-signals = "0.3.34"
wasm-bindgen-futures = "0.4.43"
cfg-if = "1.0.0"
log = "0.4.22"
gloo-events = "0.2.0"
gloo-timers = {version = "0.3.0", features = ["futures"]}
awsm_web = { version = "0.45.0", default-features = false }
dominator_helpers = {version = "0.8.0", default_features = false}
wasm-logger = { version = "0.2.0", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }

[dependencies.web-sys]
version = "0.3.69"
features = [
    "console",
    "MouseEvent",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlImageElement",
    "HtmlInputElement",
    "FileList",
    "File",
    "Window",
    "Url",
]

[lib]
crate-type = ["cdylib", "rlib"]