[package]
name        = "claw-core"
version     = "0.5.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "claw-relay protocol core: Nostr event model, signature verification, filters, transcript anchoring. wasm32-clean — no tokio, no filesystem, no C deps."

[dependencies]
serde       = { version = "1.0.160", features = ["derive"] }
serde_json  = "1.0.116"
sha2        = "0.10.6"
k256        = { version = "0.13", default-features = false, features = ["schnorr"] }
thiserror   = "1.0.38"
hex         = "0.4.3"
