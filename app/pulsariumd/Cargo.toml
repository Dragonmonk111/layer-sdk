[package]
name = "pulsariumd"
description = "Rust ABCI app to run Pulsarium with CometBFT 0.38"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# default = ["no-trace"]
# remove any unneeded baggage
optimize = ["tracing/release_max_level_info"]
# remove exceessive tracing, we often don't want
no-trace = ["tracing/release_max_level_debug"]

[dependencies]
pulsar-abci = { workspace = true }
pulsar-app = { workspace = true }
pulsar-std = { workspace = true }
pulsar-cosmos = { workspace = true }
pulsar-storage = { workspace = true, features = ["lmdb"] }

clap = { version = "4.2.4", features = ["derive"]}
figment = { version = "0.10.8", features = ["env", "toml"]}
serde = { workspace = true }
pico-args = { version = "0.5.0", default_features = false }

cosmwasm-std = { workspace = true }
bytes = {workspace = true}

# tendermint-abci = "0.33.0"
# tendermint-proto = "0.33.0"
# This rev is merged to main, but not yet tagged
tendermint-proto = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { version="0.3.17", features = ["time", "local-time", "ansi", "parking_lot", "env-filter"]}
thiserror = { workspace = true }
parking_lot = { workspace = true }
sha2 = { workspace = true }

opentelemetry = { workspace = true, features = ["rt-tokio"] }
opentelemetry-jaeger = { workspace = true, features = ["collector_client", "isahc_collector_client", "rt-tokio"] }
tracing-opentelemetry = {workspace = true}

tokio = { version = "1.28.0", features = ["full"] }
tonic = "0.9.2"

ibc-proto = { version = "=0.30.0", default-features = false, features = ["server"] }
#cosmos-sdk-proto = { workspace = true, features = ["grpc"] }

[dev-dependencies]
hex-literal = {workspace = true }