# Usage:
# sudo ./scripts/build_docker.sh
# sudo ./scripts/reset_volumes.sh
# sudo docker compose up
# cd integration && npm ci &&  npm run test
# open http://localhost:8080

# http://localhost:26657  - Tendermint RPC
# http://localhost:9090   - gRPC
# http://localhost:1317   - "LCD" / "REST"
# http://localhost:8000   - Faucet

# http://localhost:8080  - Jaeger UI
# http://localhost:9200  - Elastic Search API
# http://localhost:9200/_search  - Check for data

# http://localhost:11434  - Ollama API

volumes:
  lay3r_data:
    external: true
  comet_data:
    external: true
  wasmatic_data:
    external: true

services:
  slay3r:
    image: "ghcr.io/lay3rlabs/slay3rd:0.5.0"
    expose:
      # abci server only for cometbft
      - "26658"
    ports:
      # open grpc server
      - "9090:9090"
    volumes:
      - lay3r_data:/root/.slay3r
    command: ["slay3rd"]
    depends_on:
      - jaeger
    environment:
      - RUST_BACKTRACE=1

  cometbft:
    image: "cometbft/cometbft:v0.38.12"
    expose:
      # for slay3r grpc callbacks
      - "26657"
    environment:
      - CMT_LOG_LEVEL = "mempool:debug,abci:debug,*:info"
    ports:
      - "26656:26656"
      - "26657:26657"
    command: ["start", "--proxy_app", "tcp://slay3r:26658"]
    volumes:
      - comet_data:/cometbft
    depends_on:
      - slay3r

  # Default all-memory Jaeger
  jaeger:
    image: jaegertracing/all-in-one:1.59
    expose:
      - "6831/udp"
      - "6832/udp"
      - "14268"
    ports:
      - "8080:16686"

  gateway:
    image: "ghcr.io/lay3rlabs/gateway:0.5.0"
    ports:
      # rest port
      - "1317:1317"
    # connect to the grpc endpoint on lay3r
    command: ["/app", "-grpc-server-endpoint", "slay3r:9090"]
    depends_on:
      - slay3r

  # TODO: update this to the climb faucet
  faucet:
    image: "ghcr.io/lay3rlabs/faucet:latest"
    # Setup based on https://github.com/cosmos/cosmjs/tree/main/packages/faucet#working-with-docker
    env_file:
      - ./faucet.env
    environment:
      - FAUCET_CONCURRENCY=3
      - FAUCET_ADDRESS_PREFIX=layer
      - FAUCET_TOKENS=uslay
      - FAUCET_GAS_PRICE=0.025uslay
    ports:
      - "8000:8000"
    command: ["start", "http://cometbft:26657"]
    depends_on:
      - cometbft
    restart: unless-stopped
    profiles: [faucet]

  wasmatic:
    image: "ghcr.io/lay3rlabs/wasmatic:0.1.0"
    env_file:
      - ./wasmatic.env
    ports:
      - "8081:8081"
    depends_on:
      - slay3r
      - cometbft
      - ollama
    profiles: [wasmatic]
    volumes:
      - wasmatic_data:/wasmatic
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ollama:
    image: ollama/ollama:0.3.14
    expose:
      - "11434:11434"
    ports:
      - "11434:11434"
    profiles: [wasmatic]
    restart: unless-stopped
    healthcheck:
      test: ollama list || exit 1
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 10s
    volumes:
      - ./ollama/ollama:/root/.ollama
    # GPU support
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    networks:
      - ollama_network

  ollama-models-pull:
    container_name: ollama-models-pull
    image: curlimages/curl:latest
    command: >
      http://ollama:11434/api/pull -d '{"name":"llama3.2:1b"}'
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ollama_network

networks:
  ollama_network:
    driver: bridge
