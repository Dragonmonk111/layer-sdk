[package]
name = "junoclaw-light-client"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# use library feature to disable all instantiate/execute/query exports
library = []

[dependencies]
cosmwasm-schema = { workspace = true }
# NOTE: NOT `workspace = true`. The workspace default enables `cosmwasm_2_0`,
# which transitively emits `requires_cosmwasm_1_1..2_0` capability markers.
# The 08-wasm VM runs a *restricted* capability set (iterator only) and rejects
# contracts requiring cosmwasm_* capabilities. This contract only uses core
# ungated API (to_json_binary/from_json/to_json_vec), so we pin minimal
# features. Resolves to the same local fork via [patch.crates-io].
cosmwasm-std = { version = "=2.3.2", default-features = false, features = ["iterator"] }
cw-storage-plus = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
# NOTE: bincode is NOT a runtime dep — the verifier reads `state_root` as the
# trailing 32 bytes of the signed payload (it is the last bincode field). It is
# only a dev-dependency for building fixture payloads in tests.
# bls12_381's `experimental` hash-to-curve module (ExpandMsgXmd) is built
# against the older `digest` 0.9 API — a separate sha2 release line from the
# workspace's sha2 0.10.x. Both can coexist under a package rename.
sha2-09 = { package = "sha2", version = "0.9" }
bls12_381 = { version = "0.8", default-features = false, features = ["groups", "pairings", "alloc", "experimental"] }
group = { version = "0.13", default-features = false }
pairing = { version = "0.23", default-features = false }

[dev-dependencies]
bincode = "1.3"
cw-multi-test = { workspace = true }
commonware-cryptography = "2026.3.0"
commonware-codec = "2026.3.0"
commonware-utils = "2026.3.0"
commonware-parallel = "2026.3.0"
rand = "0.8"
