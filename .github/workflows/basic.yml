name: Basic Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # rocksdb and the wasmer tree take a lot of space.
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          tool-cache: false
          large-packages: false
          swap-storage: false

      # lib/cosmwasm is a submodule: [patch.crates-io] cosmwasm-* entries
      # resolve against it. Without recursive checkout the patch dir is
      # empty and the build fails before compiling anything.
      - name: Checkout sources (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The tree uses std APIs newer than the old pinned toolchain
      # (Option::is_none_or, usize::is_multiple_of). Track stable, which
      # also matches the release Dockerfile's toolchain.
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up cargo cache
        uses: Swatinem/rust-cache@v2

      # wasmer 4.3.7 references __rust_probestack, removed from recent Rust
      # stdlib. Provide the shim the release Dockerfile uses so linking
      # succeeds (docker/shim.c).
      - name: Build probestack shim
        run: cc -c -o /tmp/shim.o docker/shim.c

      - name: Build workspace
        run: cargo build --workspace --locked
        env:
          RUSTFLAGS: "-C link-arg=/tmp/shim.o"

      # slay3rd is the validator binary; gate on its tests with the same
      # rocksdb feature the release build ships.
      - name: Test slay3rd
        run: cargo test -p slay3rd --features rocksdb --locked
        env:
          RUSTFLAGS: "-C link-arg=/tmp/shim.o"
          RUST_BACKTRACE: 1

  lints:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout sources (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build probestack shim
        run: cc -c -o /tmp/shim.o docker/shim.c

      # Advisory only for now: the tree predates a fmt/clippy-clean pass.
      # Warnings surface on the PR without blocking it; promote to a hard
      # gate (-D warnings) once the backlog is cleaned.
      - name: Run clippy (advisory)
        run: cargo clippy --workspace --all-targets --locked || true
        env:
          RUSTFLAGS: "-C link-arg=/tmp/shim.o"
