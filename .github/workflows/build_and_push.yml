name: Build and Push Multi-Arch Images

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  REGISTRY_IMAGE: ghcr.io/lay3rlabs/layer-sdk

jobs:
  build_amd64:
    name: Build and Push AMD64 Image
    runs-on: linux-8-core
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Set IMAGE_TAGS
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TAG="${TAG#v}"
            TAG="${TAG//[^a-zA-Z0-9_.-]/-}"
            IMAGE_TAGS="${TAG},latest"
          else
            TAG="latest"
            IMAGE_TAGS="${TAG}"
          fi
          echo "IMAGE_TAGS=${IMAGE_TAGS}" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.slay3rd
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ env.IMAGE_TAGS }}-amd64
          platforms: linux/amd64
          provenance: false

  build_arm64:
    name: Build and Push ARM64 Image
    runs-on: arm64-builder
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Set IMAGE_TAGS
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TAG="${TAG#v}"
            TAG="${TAG//[^a-zA-Z0-9_.-]/-}"
            IMAGE_TAGS="${TAG},latest"
          else
            TAG="latest"
            IMAGE_TAGS="${TAG}"
          fi
          echo "IMAGE_TAGS=${IMAGE_TAGS}" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.slay3rd
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ env.IMAGE_TAGS }}-arm64
          platforms: linux/arm64
          provenance: false

  create_manifest:
    name: Create and Push Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [build_amd64, build_arm64]
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Set IMAGE_TAGS
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TAG="${TAG#v}"
            TAG="${TAG//[^a-zA-Z0-9_.-]/-}"
            IMAGE_TAGS="${TAG},latest"
          else
            TAG="latest"
            IMAGE_TAGS="${TAG}"
          fi
          echo "IMAGE_TAGS=${IMAGE_TAGS}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        shell: bash
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "${IMAGE_TAGS}"
          for TAG in "${TAG_ARRAY[@]}"; do
            docker buildx imagetools create \
              --tag ${{ env.REGISTRY_IMAGE }}:${TAG} \
              ${{ env.REGISTRY_IMAGE }}:${TAG}-amd64 \
              ${{ env.REGISTRY_IMAGE }}:${TAG}-arm64
          done