name: Release slay3rd binary

# Tag a commit 'slay3rd-<name>' to produce:
#   - a GitHub release with the canonical binary + sha256
# Builds inside docker/Dockerfile.slay3rd so the artifact carries the
# canonical target-cpu + vendored MAYO-C flags — never build natively.
# Binary-only: the ghcr image push was dropped — validators run the bare
# binary; a container deploy can re-enable a push step once the slay3rd
# package grants this repo Actions write access.
on:
  push:
    tags:
      - 'slay3rd-*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build canonical image
        run: |
          TAG="${{ github.ref_name }}"
          [ "$TAG" = "" ] && TAG="manual-${{ github.sha }}"
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"
          docker build -f docker/Dockerfile.slay3rd -t slay3rd:$TAG .

      - name: Extract binary and checksum
        run: |
          cid=$(docker create slay3rd:$IMAGE_TAG)
          docker cp "$cid:/usr/local/bin/slay3rd" slay3rd
          docker rm "$cid"
          sha256sum slay3rd > slay3rd.sha256
          cat slay3rd.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            slay3rd
            slay3rd.sha256
          prerelease: true
          body: |
            Canonical build via docker/Dockerfile.slay3rd (bookworm, target-cpu=x86-64-v2, vendored MAYO-C patch).
            Verify sha256 against the attached .sha256 before deploying to any seat.
