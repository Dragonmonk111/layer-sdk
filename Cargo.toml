[workspace]
members = ["app/*", "packages/*"]
default-members   = ["app/pulsariumd"]

[workspace.package]
edition       = "2021"
version       = "0.1.0"
license       = "CC-BY-NC-ND-4.0"
repository    = "https://github.com/ethanfrey/pulsarium"

exclude = [
  # Those files are rust-optimizer artifacts. You might want to commit them for convenience but they should not be part of the source code publication.
  "contract.wasm",
  "hash.txt",
]

[workspace.dependencies]
thiserror    = "1.0.38"
cosmwasm-std = "1.2.4"
serde = { version = "1.0.160", features = ["derive"]}
tracing = "0.1.37"
bech32 = "0.9.1"
cosmrs = "0.13.0"
cosmos-sdk-proto = "0.18.0"

[profile.release]
lto              = true
opt-level        = 3
overflow-checks  = true
