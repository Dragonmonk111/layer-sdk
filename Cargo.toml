[workspace]
members = ["app/*", "contracts/*", "packages/*"]
exclude = [
  "tools/proto-compiler",
  "packages/golem",  # excluded: cw-orch-core 2.x API migration deferred
]
resolver = "2"

[workspace.package]
edition       = "2021"
version       = "0.5.0"
license       = "CC-BY-NC-ND-4.0"
repository    = "https://github.com/lay3r-labs/layer-sdk"

exclude = [
  # Those files are rust-optimizer artifacts. You might want to commit them for convenience but they should not be part of the source code publication.
  "contract.wasm",
  "hash.txt",
]

[workspace.dependencies]
thiserror    = "1.0.38"
cosmwasm-std = { version = "=2.3.2", default-features = false, features = ["cosmwasm_2_0"] }
cosmwasm-schema = { version = "=2.3.2" }
cosmwasm-crypto = { version = "=2.3.2" }
cosmwasm-vm = { version = "=2.3.2", default-features = false, features = ["iterator"] }
# Internal cosmwasm crate deps — needed for [patch.crates-io] workspace = true resolution
cosmwasm-core = { version = "=2.3.2" }
cosmwasm-derive = { version = "=2.3.2" }
cosmwasm-schema-derive = { version = "=2.3.2" }
cosmwasm-vm-derive = { version = "=2.3.2" }
schemars = "0.8.4"
cw-storage-plus = { version = "2.0.0", default-features = false }
cw-utils = "2.0.0"
cw-multi-test = "2.0.0"
cw2 = { version = "2.0.0" }
cw20 = { version = "2.0.0" }
cw20-base = { version = "2.0.0" }

serde = { version = "1.0.160", default-features = false }
serde_json = "1.0.116"
itertools = { version = "0.11.0", features = ["use_alloc"], default-features = false }
sha2 = { version = "0.10.6", default-features = false }
ripemd = { version = "0.1.3", default-features = false }
parking_lot = "0.12.1"
hex-literal = "0.4.1"
bytes = { version = "1.11.1", default-features = false }
hex = { version = "0.4.3", default-features = false }
prost = { version = "0.13", default-features = false }
prost-types = { version = "0.13", default-features = false }
tonic = "0.12.3"
tonic-reflection = "0.12.3"
tonic-web = "0.12.3"
http = "1"
tower-http = { version = "0.5", features = ["cors"] }
anyhow = { version = "1", default-features = false }

layer-app = { path = "./packages/app" }
layer-cosmos = { path = "./packages/cosmos" }
layer-golem = { path = "./packages/golem" }
layer-proto = { path = "./packages/proto" }
layer-std = { path = "./packages/std" }
layer-storage = { path = "./packages/storage" }

layer-root = { path = "./contracts/root" }
tc-echo = { path = "./contracts/echo" }
tc-caller = { path = "./contracts/caller" }

tracing = { version = "0.1.37", default-features = false }
opentelemetry = { version = "0.19.0", default-features = false }
opentelemetry-jaeger = "0.18.0"
tracing-opentelemetry = { version = "0.19.0", default-features = false }

tokio = { version = "1.28.0", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
bincode = "1.3"
toml = "0.8"

commonware-consensus     = "2026.3.0"
commonware-p2p           = "2026.3.0"
commonware-cryptography  = "2026.3.0"
commonware-runtime       = "2026.3.0"
commonware-storage       = "2026.3.0"
commonware-parallel      = "2026.3.0"
commonware-utils         = "2026.3.0"
commonware-codec         = "2026.3.0"
commonware-math          = "2026.3.0"
tokio-stream = { version = "0.1.15", default-features = false }
futures = { version = "0.3.30", default-features = false }

cosmrs = { version = "0.13.0", default-features = false, features = ["cosmwasm"] }
cosmos-sdk-proto = { version = "0.18.0", default-features = false, features = ["cosmwasm"] }
cw-orch-core = { version = "2"}
abstract-cw-multi-test = { version = "2", default-features = false }

[patch.crates-io]
# Redirect all cosmwasm crates to the fork submodule at lib/cosmwasm (v2.3.2)
# This approach avoids nested workspace inheritance issues with `workspace = true` fields
cosmwasm-std    = { path = "lib/cosmwasm/packages/std" }
cosmwasm-schema = { path = "lib/cosmwasm/packages/schema" }
cosmwasm-crypto = { path = "lib/cosmwasm/packages/crypto" }
cosmwasm-vm     = { path = "lib/cosmwasm/packages/vm" }
cosmwasm-core   = { path = "lib/cosmwasm/packages/core" }
cosmwasm-derive = { path = "lib/cosmwasm/packages/derive" }
cosmwasm-schema-derive = { path = "lib/cosmwasm/packages/schema-derive" }

[profile.release]
# temporary to speed up testing
# lto              = true
lto              = false
opt-level        = 3
overflow-checks  = true

# We have a lot of heavy dependencies like wasmer / cosmwasm-vm and tests lag if they
# are not optimized. They should be cached the first time and not need expensive re-compiles,
# so this shouldn't slow down dev loop much
# (Note this doesn't apply to workspace, just dependencies)

# DEV: you can uncomment locally
# [profile.test.package."*"]
# opt-level        = 3

[profile.release.package.tc-echo]
debug = false
debug-assertions = false
codegen-units = 1
incremental = false
# TODO: enabling these seems to break cargo...
# rpath = false
# lto = true
# panic = 'abort'
