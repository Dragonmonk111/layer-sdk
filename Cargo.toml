[workspace]
members = ["app/*", "packages/*"]
#default-members   = ["app/pulsariumd"]

[workspace.package]
edition       = "2021"
version       = "0.1.0"
license       = "CC-BY-NC-ND-4.0"
repository    = "https://github.com/ethanfrey/pulsarium"

exclude = [
  # Those files are rust-optimizer artifacts. You might want to commit them for convenience but they should not be part of the source code publication.
  "contract.wasm",
  "hash.txt",
]

[workspace.dependencies]
thiserror    = "1.0.38"
cosmwasm-std = "1.2.4"
cosmwasm-schema = "1.2.4"
cosmwasm-crypto = "1.2.4"
cw-storage-plus = "1.0.1"
cw-utils = "1.0.1"
serde = { version = "1.0.160", features = ["derive"]}
tracing = "0.1.37"
bech32 = "0.9.1"
cosmrs = "0.13.0"
cosmos-sdk-proto = "0.18.0"
itertools = "0.10.5"
sha2 = "0.10.6"
ripemd = "0.1.3"
parking_lot = "0.12.1"

pulsar-app = { path = "./packages/app" }
pulsar-std = { path = "./packages/std" }
pulsar-storage = { path = "./packages/storage" }


[profile.release]
lto              = true
opt-level        = 3
overflow-checks  = true
