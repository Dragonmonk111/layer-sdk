version: '2'

services:
  pulsariumd:
    image: "pulsar/pulsariumd:latest"
    ports:
      - "26658:26658"
  cometbft:
    image: "cometbft/cometbft:v0.38.0-rc2"
    ports:
      - "26656:26656"
      - "26657:26657"
    environment:
      - TM_PROXY_APP=tcp://pulsariumd:26658
    # TODO: better mount config / data
    volumes:
      - ./integration/etc:/root/.tendermint