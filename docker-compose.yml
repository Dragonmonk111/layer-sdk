# Usage:
# ./scripts/reset_volumes.sh
# docker compose up
# cd integration && npm run test
# open http://localhost:8000

version: '3'

volumes:
  pulsar_data:
    external: true
  comet_data:
    external: true

services:
  pulsariumd:
    image: "pulsar/pulsariumd:latest"
    expose:
      # abci server only for cometbft
      - "26658"
    ports:
      # open grpc server
      - "9090:9090"
    volumes:
      - pulsar_data:/root/.pulsar
    command: ["pulsariumd"]
  cometbft:
    image: "cometbft/cometbft:v0.38.0"
    expose:
      # for pulsariumd grpc callbacks
      - "26657"
    ports:
      - "26656:26656"
      - "26657:26657"
    command: ["start", "--proxy_app", "tcp://pulsariumd:26658"]
    volumes:
      - comet_data:/cometbft
  jaeger:
    image: jaegertracing/all-in-one:1.46
    expose:
      - "6831/udp" 
      - "6832/udp"
      - "14268"
    ports: 
      - "8080:16686"
  gateway:
    image: "pulsar/gateway:latest"
    ports:
      # rest port
      - "1317:1317"
    # connect to the grpc endpoint on pulsariumd
    command: ["/app", "-grpc-server-endpoint", "pulsariumd:9090"]
  # vectis:
  #   image: "pulsar/vectis-todo:latest"
  #   ports:
  #     # expose web app
  #     - "8000:80"
