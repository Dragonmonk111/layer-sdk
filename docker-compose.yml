version: '2'

services:
  pulsariumd:
    image: "pulsar/pulsariumd:latest"
    ports:
      - "26658:26658"
  cometbft:
    image: "cometbft/cometbft:v0.38.0-rc2"
    # image: "cometbft/cometbft:v0.38.0-alpha.2"
    ports:
      - "26656:26656"
      - "26657:26657"
    command: ["start", "--proxy_app", "tcp://pulsariumd:26658"]
    # TODO: better mount config / data
    volumes:
      - ./integration/etc:/cometbft